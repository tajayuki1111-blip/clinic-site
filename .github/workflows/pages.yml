name: Build and deploy clinic site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: ["microcms_update"]
  workflow_dispatch:
    inputs:
      allow_cms_content_drop:
        description: "意図した記事の一括削除を許可する"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test microCMS build safeguards
        run: node test/build-safety.mjs

      - name: Build static site from microCMS
        run: node build.mjs
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          MICROCMS_FIXTURE_FILE: ${{ github.event_name == 'pull_request' && 'test/fixtures/microcms.json' || '' }}
          ALLOW_CMS_CONTENT_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_cms_content_drop && 'true' || 'false' }}

      - name: Validate SEO and internal links
        run: node validate-seo.mjs _site

      - name: Check whether published output changed
        id: changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if curl --fail --silent --show-error \
            "https://ynakai-clinic.com/deployment-manifest.json" \
            --output /tmp/live-deployment-manifest.json; then
            if cmp --silent _site/deployment-manifest.json /tmp/live-deployment-manifest.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production responses
        run: node smoke-test.mjs https://ynakai-clinic.com/
