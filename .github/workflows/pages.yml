name: Build and deploy clinic site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  repository_dispatch:
    types: ["microcms_update"]
  workflow_dispatch:
    inputs:
      allow_cms_content_drop:
        description: "意図した記事の一括削除を許可する"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # build.mjs derives each stable page's sitemap lastmod from Git.
          # A shallow checkout makes every file look as if HEAD changed it.
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test microCMS build safeguards
        run: node test/build-safety.mjs

      - name: Build static site from fixture
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          test -z "${MICROCMS_API_KEY+x}"
          node build.mjs
        env:
          MICROCMS_FIXTURE_FILE: test/fixtures/microcms.json

      - name: Build static site from microCMS
        if: github.event_name != 'pull_request'
        run: node build.mjs
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          CMS_DROP_GUARD_REQUIRED: "true"
          REQUIRE_COMPLETE_GIT_HISTORY: "true"
          ALLOW_CMS_CONTENT_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_cms_content_drop && 'true' || 'false' }}

      - name: Validate SEO and internal links
        run: node validate-seo.mjs _site

      - name: Check whether published output changed
        id: changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if curl --fail --silent --show-error \
            "https://ynakai-clinic.com/deployment-manifest.json" \
            --output /tmp/live-deployment-manifest.json; then
            if cmp --silent _site/deployment-manifest.json /tmp/live-deployment-manifest.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload GitHub Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify production responses
        run: node smoke-test.mjs https://ynakai-clinic.com/
