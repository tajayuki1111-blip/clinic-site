<script>

const SERVICE_ID = "nakai-clinic";
const API_KEY = "xpk3ljGXAT8e6dyDK7jRVIOZqdrRKG7sjb2H";

const params = new URLSearchParams(window.location.search);
const newsId = params.get("id");

const newsDetail =
document.getElementById("news-detail");

if(!newsId){

newsDetail.innerHTML =
`
<div class="news-item">

<div class="news-content">
お知らせが見つかりません。
</div>

<div class="back-news-area">
<a href="/" class="back-news-btn">
一覧に戻る
</a>
</div>

</div>
`;

}else{

fetch(
`https://${SERVICE_ID}.microcms.io/api/v1/news/${newsId}`,
{
headers:{
"X-MICROCMS-API-KEY": API_KEY
}
}
)
.then(res => {

if(!res.ok){
throw new Error("取得失敗");
}

return res.json();

})
.then(news => {

const plainTitle = String(news.title || "お知らせ").replace(/<[^>]*>/g, "").trim();
const bodyText = String(news.body || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
const canonicalUrl = new URL("https://ynakai-clinic.com/news-detail.html");
canonicalUrl.searchParams.set("id", newsId);

document.title = `${plainTitle} | なかい内科血管外科クリニック`;
document.querySelector('meta[name="description"]').setAttribute(
"content",
(bodyText || `${plainTitle}についてのお知らせです。`).slice(0, 120)
);
document.getElementById("canonical-url").setAttribute("href", canonicalUrl.href);
document.getElementById("news-structured-data").textContent = JSON.stringify({
"@context":"https://schema.org",
"@type":"NewsArticle",
"headline":plainTitle,
"datePublished":news.publishedAt,
"dateModified":news.updatedAt || news.publishedAt,
"mainEntityOfPage":canonicalUrl.href,
"author":{"@type":"Organization","name":"なかい内科血管外科クリニック"},
"publisher":{
"@type":"MedicalClinic",
"@id":"https://ynakai-clinic.com/#clinic",
"name":"なかい内科血管外科クリニック",
"logo":{"@type":"ImageObject","url":"https://ynakai-clinic.com/logo.png"}
}
});

newsDetail.innerHTML =
`
<div class="news-item">

<div class="news-date">
${new Date(news.publishedAt).toLocaleDateString("ja-JP")}
</div>

<h1 class="news-detail-title">
${news.title}
</h1>

<div class="news-content">
${news.body}
</div>

<div class="back-news-area">
<a href="news.html" class="back-news-btn">
一覧に戻る
</a>
</div>

</div>
`;

})
.catch(error => {

newsDetail.innerHTML =
`
<div class="news-item">

<div class="news-content">
お知らせを読み込めません。
</div>

<div class="back-news-area">
<a href="news.html" class="back-news-btn">
一覧に戻る
</a>
</div>

</div>
`;

});

}

</script>
