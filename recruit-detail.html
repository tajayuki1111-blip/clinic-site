<script>

const SERVICE_ID = "nakai-clinic";

const API_KEY = "";

const params =
new URLSearchParams(window.location.search);

const recruitId =
params.get("id");

const recruitDetail =
document.getElementById("recruit-detail");

if(!recruitId){

recruitDetail.innerHTML =
`
<div class="news-item">

<div class="news-content">
募集情報が見つかりません。
</div>

<div class="back-news-area">

<a href="index.html"
class="back-news-btn">

ホームに戻る

</a>

</div>

</div>
`;

}else{

fetch(
`https://${SERVICE_ID}.microcms.io/api/v1/recruit/${recruitId}`,
{
headers:{
"X-MICROCMS-API-KEY": API_KEY
}
}
)
.then(res => {

if(!res.ok){
throw new Error("取得失敗");
}

return res.json();

})
.then(recruit => {

const plainTitle = String(recruit.title || "スタッフ募集").replace(/<[^>]*>/g, "").trim();
const bodyText = String(recruit.body || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
const canonicalUrl = new URL("https://ynakai-clinic.com/recruit-detail.html");
canonicalUrl.searchParams.set("id", recruitId);

document.title = `${plainTitle} | なかい内科血管外科クリニック`;
document.querySelector('meta[name="description"]').setAttribute(
"content",
(bodyText || `${plainTitle}の募集情報です。`).slice(0, 120)
);
document.getElementById("canonical-url").setAttribute("href", canonicalUrl.href);
document.getElementById("recruit-structured-data").textContent = JSON.stringify({
"@context":"https://schema.org",
"@type":"JobPosting",
"title":plainTitle,
"description":bodyText,
"datePosted":recruit.publishedAt,
"hiringOrganization":{
"@type":"MedicalClinic",
"@id":"https://ynakai-clinic.com/#clinic",
"name":"なかい内科血管外科クリニック",
"sameAs":"https://ynakai-clinic.com/"
},
"jobLocation":{
"@type":"Place",
"address":{
"@type":"PostalAddress",
"postalCode":"574-0014",
"addressRegion":"大阪府",
"addressLocality":"大東市",
"streetAddress":"寺川3丁目9-16",
"addressCountry":"JP"
}
}
});

recruitDetail.innerHTML =
`

<div class="news-item">

<h1 class="news-detail-title">
${recruit.title}
</h1>

<div class="news-content">
${recruit.body}
</div>

<div class="back-news-area">

<a href="/#recruit"
class="back-news-btn">

ホームに戻る

</a>

</div>

</div>

`;

})
.catch(error => {

recruitDetail.innerHTML =
`

<div class="news-item">

<div class="news-content">
募集情報を読み込めません。
</div>

<div class="back-news-area">

<a href="/#recruit"
class="back-news-btn">

ホームに戻る

</a>

</div>

</div>

`;

});

}

</script>
